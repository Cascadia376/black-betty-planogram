name: Isolated engineering workspace

on:
  push:
    branches: [engineering/black-betty-hardening-2026-09-21]
    paths: [.github/workflows/engineering-workspace.yml]

permissions:
  contents: read

jobs:
  workspace:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - name: Archive only tracked source and locked dependencies
        run: |
          git archive --format=tar.gz --output=source.tar.gz HEAD
          tar -czf dependencies.tar.gz node_modules
      - uses: actions/upload-artifact@v4
        with:
          name: engineering-workspace
          path: |
            source.tar.gz
            dependencies.tar.gz
          retention-days: 1
          compression-level: 0
      - name: Prepare isolated Chromium for local regression verification
        env:
          PLAYWRIGHT_BROWSERS_PATH: ./engineering-browsers
        run: |
          npx playwright install chromium --only-shell
          tar -czf browsers.tar.gz engineering-browsers
      - uses: actions/upload-artifact@v4
        with:
          name: engineering-browser
          path: browsers.tar.gz
          retention-days: 1
          compression-level: 0
